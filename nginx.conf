server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Pre-compressed assets (Vite produces .gz via vite-plugin-compression)
    # Note: Stock nginx:alpine includes http_gzip_static_module.
    # Brotli (.br) is omitted to avoid non-standard dynamic modules in production.
    gzip_static on;

    # Basic security headers (safe for SPA, Maps, Pixel, Chat)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Fingerprinted static assets (immutable caching)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Root and HTML files (never aggressively cache entrypoint)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }

    # API reverse proxy to backend Express container
    location /api {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;

        # Forwarded headers chain: Traefik -> Nginx -> Express
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / Streaming support if needed
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts and buffer settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 25M;
    }

    # Health check proxy to backend
    location /health {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing fallback: any unknown route serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
