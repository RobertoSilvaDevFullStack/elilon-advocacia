services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
        - VITE_ENABLE_CHAT=${VITE_ENABLE_CHAT:-true}
        - VITE_N8N_CHAT_WEBHOOK_URL=${VITE_N8N_CHAT_WEBHOOK_URL:-}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL}
      - TRUST_PROXY=loopback,linklocal,uniquelocal
      - FRONTEND_URL=${FRONTEND_URL:-https://elilonlopesadvogados.com.br}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://elilonlopesadvogados.com.br,https://www.elilonlopesadvogados.com.br}
      - JWT_SECRET=${JWT_SECRET}
      - CHAT_UPLOADS_DIR=/app/uploads
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@elilon.adv.br}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-}
      - HERMES_WEBHOOK_URL=${HERMES_WEBHOOK_URL:-}
    volumes:
      - backend-uploads:/app/uploads
    # Port 5000 is NOT exposed publicly; only accessible internally via app-network
    expose:
      - "5000"
    restart: unless-stopped
    networks:
      - app-network

volumes:
  backend-uploads:
    driver: local

networks:
  app-network:
    driver: bridge
