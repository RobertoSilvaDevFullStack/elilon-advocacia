<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1A1A1A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Elilon Lopes Advogados | Sociedade de Advogados</title>
  <meta name="description"
    content="Escritório de advocacia empresarial em Montes Claros - MG. Soluções jurídicas inovadoras." />

  <!-- Critical resource hints — apenas fontes (YouTube carrega lazy na Home) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

  <!-- Logo LCP — WebP leve (~5 KB) -->
  <link rel="preload" href="/images/logo-elilon.webp" as="image" type="image/webp" fetchpriority="high" />

  <!-- Fontes: pesos reduzidos + display=swap, sem bloquear render -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Cabin:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" />
  <link
    href="https://fonts.googleapis.com/css2?family=Cabin:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Cabin:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap"
      rel="stylesheet" />
  </noscript>

  <link rel="icon" type="image/webp" href="/images/logo-elilon.webp" />
  <link rel="alternate" type="text/plain" href="/llms.txt" title="LLMs" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
