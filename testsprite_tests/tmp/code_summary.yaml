version: "2"
type: frontend
tech_stack:
  - React 18
  - Vite
  - Tailwind CSS
  - React Router
  - Node.js (Backend)
routes:
  - path: /
    file: pages/Home.tsx
    auth_required: false
    description: Home page introducing the firm
  - path: /areas
    file: pages/Areas.tsx
    auth_required: false
    description: Practice areas explanation
  - path: /admin
    file: pages/Admin.tsx
    auth_required: true
    description: Private admin dashboard to manage blog and professionals
  - path: /blog
    file: pages/Blog.tsx
    auth_required: false
    description: List of articles
  - path: /contato
    file: pages/Contact.tsx
    auth_required: false
    description: Contact page form and info
features:
  - name: User Login (Admin)
    description: Admin authentication via Supabase
    files:
      - pages/Admin.tsx
    entry_route: /admin
    user_interactions:
      - Fill email input field
      - Fill password input field
      - Click Login button to submit
    api_calls:
      - method: POST
        endpoint: /auth/v1/token
    auth_required: false
  - name: Navigation View
    description: Switch between different pages
    files:
      - App.tsx
      - components/Navbar.tsx
    entry_route: /
    user_interactions:
      - Click links on Navbar
      - Read content
    api_calls: []
    auth_required: false
known_limitations: []
